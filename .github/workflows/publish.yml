# Publish every workspace package to npm when a release tag is pushed.
# Tags follow the versioning scheme: v<generation>.<YYYYMMDD>.<patch>,
# e.g. v1.20260814.0.
#
# Auth is npm trusted publishing (OIDC): each package's Settings ->
# Trusted publisher on npmjs.com names this repository and workflow, and
# npm mints short-lived credentials from the runner's OIDC token —
# no NPM_TOKEN secret, no OTP, and provenance attestations for free.
# (Token-based publishing dead-ends at EOTP: the account requires 2FA
# and npm is deprecating tokens that bypass it.)
#
# Publishing is deliberate, never automatic on merge — the press has no
# remote switch (NORTH-STAR §10), and its releases are the same way:
# a human tags, the tag publishes.
name: publish
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # No registry-url here, deliberately: setup-node's registry-url
      # writes an .npmrc auth line fed by NODE_AUTH_TOKEN, and exports a
      # PLACEHOLDER token when none is provided — and any token at all
      # makes npm skip the OIDC exchange and publish unauthenticated
      # (the v2.20260816.0 run's E404). With no token in sight, npm
      # negotiates trusted publishing on its own.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing needs a newer npm than node 22 bundles.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Per-package, from each package directory, in dependency order:
      # `npm publish --workspaces` skipped the OIDC exchange entirely
      # (the v2.20260816.1 ENEEDAUTH) — trusted publishing negotiates per
      # package, from the package's own directory. Platform leads so a
      # first-publish auth failure stops the train before any dependent
      # ships without its dependencies.
      - run: |
          set -e
          for p in platform engine-eto engine-desk engine-letter engine-digest engine-sports engine-wrap press cli subscribe; do
            echo "── publishing @eto-press/$p"
            (cd packages/$p && npm publish)
          done
