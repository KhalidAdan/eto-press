# Publish every workspace package to npm when a release tag is pushed.
# Tags follow the versioning scheme: v<generation>.<YYYYMMDD>.<patch>,
# e.g. v1.20260813.0. Requires the NPM_TOKEN repository secret (an npm
# granular token with publish rights on the @eto-press scope).
#
# Publishing is deliberate, never automatic on merge — the press has no
# remote switch (NORTH-STAR §10), and its releases are the same way:
# a human tags, the tag publishes.
name: publish
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm publish --workspaces
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
