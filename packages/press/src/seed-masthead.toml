# The masthead file — your editorial line.
#
# Every outlet your paper reads is listed here, and the "side" label on
# each one is YOUR call — the press only uses it to measure when a
# story's coverage has collapsed onto one side. Disagree with a label?
# Change it. That is the point of the file.
#
# This starting roster is the press's Default Masthead, seeded from the
# AllSides Media Bias Chart v11.3 (audited 2026-07-25; the full shelf
# with open/closed status and paywall caveats is docs/SOURCES.md in the
# eto-press repository). It is a beginning, not a verdict: the paper
# becomes yours the first time you edit this file.

# One model-nominated story per day from outside the front page, its
# reason printed for you to judge. Set false and it is gone.
below_the_fold = true

# Morning email delivery. Leave false until your mail domain is verified
# and [mail] in eto.toml says who you are.
email_edition = false

# Where these side labels came from — a claim YOUR paper makes on its
# sources page. If you relabel or reroster on your own judgment, rewrite
# or remove this block; the press asserts nothing it does not know.
[seed]
name = "AllSides Media Bias Chart"
url = "https://www.allsides.com/media-bias/media-bias-chart"
version = "v11.3"
description = "which rates outlets from left to right by balancing the judgment of readers and reviewers across the political spectrum"

# ---- left -------------------------------------------------------------

[[source]]
name = "The Guardian"
side = "left"
feeds = [
  "https://www.theguardian.com/us-news/rss",
  "https://www.theguardian.com/world/rss",
]

